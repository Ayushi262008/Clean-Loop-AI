<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="EcoTrack - Intelligent civic waste management, automated AI triage, community pickups, and interactive waste segregation.">
  <title>EcoTrack — Waste Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header / Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand" id="logo" tabindex="0" role="button" aria-label="EcoTrack Dashboard">
        <div class="brand-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/>
            <path d="M11 19h8.2a1.8 1.8 0 0 0 1.565-.89 1.78 1.78 0 0 0 .005-1.78l-3.95-6.83"/>
            <path d="M9.19 5.86 12 1l2.81 4.86"/>
            <path d="M2 13h4.5"/>
            <path d="m15.5 13 2.25 4"/>
            <path d="m6.25 17 2.25-4"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Eco<b>Track</b></span>
          <span class="brand-badge">Waste Management System</span>
        </div>
      </div>

      <nav id="nav" class="nav-links" aria-label="Main Navigation"></nav>

      <div class="header-actions">
        <div id="user-pill"></div>
        <button class="theme-toggle" id="th" aria-label="Toggle dark mode" title="Switch between dark and light themes">◐</button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app" class="main-content" role="main"></main>

  <!-- Accessible Auth Modal Dialog -->
  <div id="auth-modal" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-tabs">
          <button type="button" class="modal-tab active" id="tab-login-btn">Sign In</button>
          <button type="button" class="modal-tab" id="tab-register-btn">Create Account</button>
        </div>
        <button type="button" class="modal-close" id="modal-close-btn" aria-label="Close dialog">✕</button>
      </div>

      <form id="auth-form" class="modal-body" onsubmit="return false;">
        <h2 id="modal-title" class="modal-heading">Welcome back to EcoTrack</h2>
        <p class="modal-subheading" id="modal-desc">Sign in to report waste, track your complaints, and earn eco points.</p>

        <div id="auth-error" class="form-alert" style="display:none;"></div>

        <div class="form-group" id="group-name" style="display:none;">
          <label for="modal-name">Full Name</label>
          <input type="text" id="modal-name" placeholder="e.g. Priya Sharma" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="modal-contact">Mobile Number or Email</label>
          <input type="text" id="modal-contact" placeholder="e.g. priya@ecotrack.org or 9876543210" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="modal-pass">Password</label>
          <input type="password" id="modal-pass" placeholder="At least 6 characters" required autocomplete="current-password">
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary btn-block" id="modal-submit-btn">Sign In</button>
        </div>

        <div class="demo-hints">
          <span class="hint-title">Hackathon Demo Accounts:</span>
          <span><b>Admin:</b> admin@cleanloop.ai / admin123</span>
          <span><b>Citizen:</b> priya@ecotrack.org / demo123</span>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Pill -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
